name: Generator drift

# The Checks tab mirrors OpenFront's Go map generator. This runs the same fixture maps through
# FrontMapper's prediction and the latest generator every week, and opens an issue when they
# stop agreeing (and closes it again once they match). Pull requests that touch the port run it
# too, without opening issues.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - src/core/generator.ts
      - scripts/verify-generator/**
      - .github/workflows/generator-drift.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: generator-drift
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: npm ci
      - name: Compare with OpenFront's generator
        id: verify
        shell: bash
        run: |
          set -o pipefail
          npm run verify:generator 2>&1 | tee verify.log
      - name: OpenFront commit checked
        if: always()
        id: ofio
        run: echo "sha=$(git -C .cache/ofio rev-parse HEAD 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"
      - name: Open or update the drift issue
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          OFIO_SHA: ${{ steps.ofio.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('verify.log') ? fs.readFileSync('verify.log', 'utf8') : '(no log)';
            const tail = log.trim().split('\n').slice(-40).join('\n');
            const title = "Checks tab no longer matches OpenFront's map generator";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = process.env.OFIO_SHA;
            const body = [
              `The weekly comparison with OpenFrontIO \`${sha.slice(0, 10)}\` failed: FrontMapper's Checks tab no longer predicts exactly what the Go generator deletes, or the generator did not build.`,
              '',
              `Run: ${run}`,
              '',
              '```',
              tail,
              '```',
              '',
              'Compare `src/core/generator.ts` with `map-generator/map_generator.go` (removeSmallIslands, processWater) and update the port. Run `npm run verify:generator` locally to check.',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
      - name: Close the drift issue once it matches again
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Checks tab no longer matches OpenFront's map generator";
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            for (const i of open.filter((i) => i.title === title && !i.pull_request)) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: 'The latest generator matches the Checks tab again.' });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed' });
            }
